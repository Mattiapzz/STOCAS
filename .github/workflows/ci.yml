name: CI

on:
  push:
    branches: [main]
  pull_request:
  # windows-msvc (build-and-test) and BUILD_SHARED_LIBS=ON (windows-latest)
  # only run for this trigger, not push/pull_request - vcpkg building
  # GMP/MPFR from source is by far the slowest and priciest leg. Run it
  # manually (`gh workflow run ci.yml`) once a milestone's tasks are all
  # merged, rather than on every per-task push.
  workflow_dispatch:

jobs:
  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find src test examples -type f \( -name '*.hh' -o -name '*.cc' \) 2>/dev/null \
            | xargs -r clang-format --dry-run --Werror

  build-and-test:
    name: ${{ matrix.target }} (${{ matrix.build_type }})
    needs: format-check
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        # `target` is a real matrix dimension (crossed with build_type below),
        # not an include-only key: GitHub Actions only cross-multiplies
        # `include` entries against existing matrix keys they share. Since
        # none of these entries shared a key with build_type, only the last
        # entry ever got scheduled - 6 of 8 legs were silently dropped on
        # every run since this workflow was introduced. `include` here only
        # attaches os/preset_prefix per target, it doesn't define new combos.
        target: [linux-gcc, linux-clang, macos-clang, windows-msvc]
        include:
          - target: linux-gcc
            os: ubuntu-latest
            preset_prefix: linux-gcc
          - target: linux-clang
            os: ubuntu-latest
            preset_prefix: linux-clang
          - target: macos-clang
            os: macos-latest
            preset_prefix: macos-clang
          - target: windows-msvc
            os: windows-latest
            preset_prefix: windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages pytest

      - name: Install GMP/MPFR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install GMP/MPFR (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr

      # windows-msvc only builds on workflow_dispatch (see the `on:` block
      # above) - vcpkg building GMP/MPFR from source is the slowest, most
      # expensive leg (2x runner-minute multiplier on top of that), so it's
      # skipped on every per-task push/PR and run manually at milestone
      # gates instead. The job still spins up a windows-latest runner for a
      # few seconds (all its steps below skip), which is negligible next to
      # the 15-30 min a real vcpkg build takes.
      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-gmp-mpfr-x64-windows-${{ hashFiles('Dependencies.cmake') }}

      - name: Install GMP/MPFR (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        run: vcpkg install gmp:x64-windows mpfr:x64-windows

      - name: Cache FetchContent / build dir
        if: matrix.target != 'windows-msvc' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}/_deps
          key: ${{ matrix.os }}-${{ matrix.preset_prefix }}-${{ matrix.build_type }}-${{ hashFiles('Dependencies.cmake') }}

      - name: Configure
        if: matrix.target != 'windows-msvc' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: >
          cmake --preset
          ${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build
        if: matrix.target != 'windows-msvc' || github.event_name == 'workflow_dispatch'
        run: >
          cmake --build
          build/${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
          --config ${{ matrix.build_type }}

      - name: Test
        if: matrix.target != 'windows-msvc' || github.event_name == 'workflow_dispatch'
        run: >
          ctest --test-dir
          build/${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
          --build-config ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: sanitizers (non-blocking)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-asan-ubsan
            cmake_flags: "-DSTOCAS_ENABLE_ASAN=ON -DSTOCAS_ENABLE_UBSAN=ON"
          - os: macos-latest
            name: macos-asan-ubsan
            cmake_flags: "-DSTOCAS_ENABLE_ASAN=ON -DSTOCAS_ENABLE_UBSAN=ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages pytest
      - name: Install GMP/MPFR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev
      - name: Install GMP/MPFR (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr
      - name: Configure
        run: cmake -S . -B build/sanitizer -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build/sanitizer
      - name: Test
        # hello_core_python_tests is excluded here: loading an ASan/TSan
        # -instrumented .dylib/.so into an unsanitized Python interpreter is
        # a known incompatibility, not a real bug (see [numerica_core] test
        # exclusion note in test/hello_core/CMakeLists.txt).
        run: ctest --test-dir build/sanitizer --output-on-failure -E hello_core_python_tests

  sanitizer-tsan:
    name: linux-tsan
    needs: format-check
    # Blocking (no continue-on-error), unlike the other sanitizer legs
    # above: M2-GATE requires the symbol_table concurrency contract's TSan
    # stress test (test/symbol_table/test_concurrency.cc, M2-T4) to be a
    # blocking CI leg specifically, since a green TSan report - not just
    # "the process didn't crash" - is the only real evidence that contract
    # holds. Split into its own job (rather than continue-on-error per
    # matrix entry, which can't vary by matrix value at the job level) so
    # this one leg can be blocking while linux-asan-ubsan/macos-asan-ubsan
    # above stay opt-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages pytest
      - name: Install GMP/MPFR (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev
      - name: Configure
        run: cmake -S . -B build/sanitizer -DCMAKE_BUILD_TYPE=Debug -DSTOCAS_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build/sanitizer
      - name: Test
        # See the sanitizers job's identical note on hello_core_python_tests.
        run: ctest --test-dir build/sanitizer --output-on-failure -E hello_core_python_tests

  fuzz-parser:
    name: atom_core parser fuzz (non-blocking)
    continue-on-error: true
    needs: format-check
    # M3-T2 exit criteria: the parser fuzzed for a fixed CPU-time budget
    # with zero crashes. Non-blocking like the `sanitizers` job (fuzzing is
    # inherently exploratory, not a per-commit correctness gate) but runs on
    # every push/PR rather than on a separate schedule, to keep the CI
    # wiring simple. libFuzzer requires clang; the fuzz target is opt-in
    # (STOCAS_ENABLE_FUZZING) and excluded from the regular Catch2 binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP/MPFR
        run: sudo apt-get update && sudo apt-get install -y clang libgmp-dev libmpfr-dev
      - name: Configure
        run: >
          cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DSTOCAS_ENABLE_FUZZING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/fuzz --target atom_core_fuzz_parser
      - name: Fuzz
        # See fuzz_parser.cc's header comment: ASAN_OPTIONS=detect_leaks=0
        # suppresses symbol_table's already-documented, already-intentional
        # Snapshot leak (M2-T4), which libFuzzer's own periodic leak check
        # re-flags independently of LeakSanitizer's normal end-of-process
        # check - not a real bug, and not what this job is meant to catch.
        run: >
          ASAN_OPTIONS=detect_leaks=0
          ./build/fuzz/test/atom_core/atom_core_fuzz_parser -max_total_time=60 -close_fd_mask=3

  sanitizer-asan:
    name: linux-asan-ubsan (blocking)
    needs: format-check
    # Blocking (no continue-on-error), unlike the `sanitizers` job above:
    # M2-T6 requires Workspace's allocate/reset fuzz test
    # (test/symbol_table/test_workspace.cc) to be ASan-clean as a blocking
    # CI leg specifically, since a green ASan report - not just "the
    # process didn't crash" - is the only real evidence the poison/unpoison
    # use-after-reset contract holds. Split into its own job (same reason
    # as sanitizer-tsan above: continue-on-error can't vary per matrix
    # entry at the job level) so this leg can be blocking while the
    # `sanitizers` job's linux-asan-ubsan/macos-asan-ubsan legs stay opt-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages pytest
      - name: Install GMP/MPFR (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev
      - name: Configure
        run: cmake -S . -B build/sanitizer -DCMAKE_BUILD_TYPE=Debug -DSTOCAS_ENABLE_ASAN=ON -DSTOCAS_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build/sanitizer
      - name: Test
        # See the sanitizers job's identical note on hello_core_python_tests.
        run: ctest --test-dir build/sanitizer --output-on-failure -E hello_core_python_tests

  shared-libs:
    name: BUILD_SHARED_LIBS=ON (non-blocking)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages pytest
      - name: Install GMP/MPFR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev
      - name: Install GMP/MPFR (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr
      # windows-latest only builds here on workflow_dispatch - same
      # milestone-gate-only rationale as build-and-test's windows-msvc leg.
      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-gmp-mpfr-x64-windows-${{ hashFiles('Dependencies.cmake') }}
      - name: Install GMP/MPFR (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        run: vcpkg install gmp:x64-windows mpfr:x64-windows
      - name: Configure
        if: matrix.os != 'windows-latest' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: >
          cmake -S . -B build/shared -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake' || '' }}
      - name: Build
        if: matrix.os != 'windows-latest' || github.event_name == 'workflow_dispatch'
        run: cmake --build build/shared
      - name: Test
        if: matrix.os != 'windows-latest' || github.event_name == 'workflow_dispatch'
        run: ctest --test-dir build/shared --output-on-failure -E hello_core_python_tests
