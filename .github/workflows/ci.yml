name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find src test examples -type f \( -name '*.hh' -o -name '*.cc' \) 2>/dev/null \
            | xargs -r clang-format --dry-run --Werror

  build-and-test:
    name: ${{ matrix.name }} (${{ matrix.build_type }})
    needs: format-check
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        include:
          - name: linux-gcc
            os: ubuntu-latest
            preset_prefix: linux-gcc
          - name: linux-clang
            os: ubuntu-latest
            preset_prefix: linux-clang
          - name: macos-clang
            os: macos-latest
            preset_prefix: macos-clang
          - name: windows-msvc
            os: windows-latest
            preset_prefix: windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent / build dir
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}/_deps
          key: ${{ matrix.os }}-${{ matrix.preset_prefix }}-${{ matrix.build_type }}-${{ hashFiles('Dependencies.cmake') }}

      - name: Configure
        run: >
          cmake --preset
          ${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Build
        run: >
          cmake --build
          build/${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
          --config ${{ matrix.build_type }}

      - name: Test
        run: >
          ctest --test-dir
          build/${{ matrix.preset_prefix }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
          --build-config ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: sanitizers (non-blocking)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-asan-ubsan
            cmake_flags: "-DSTOCAS_ENABLE_ASAN=ON -DSTOCAS_ENABLE_UBSAN=ON"
          - os: ubuntu-latest
            name: linux-tsan
            cmake_flags: "-DSTOCAS_ENABLE_TSAN=ON"
          - os: macos-latest
            name: macos-asan-ubsan
            cmake_flags: "-DSTOCAS_ENABLE_ASAN=ON -DSTOCAS_ENABLE_UBSAN=ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/sanitizer -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build/sanitizer
      - name: Test
        run: ctest --test-dir build/sanitizer --output-on-failure

  shared-libs:
    name: BUILD_SHARED_LIBS=ON (non-blocking)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/shared -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON
      - name: Build
        run: cmake --build build/shared
      - name: Test
        run: ctest --test-dir build/shared --output-on-failure
